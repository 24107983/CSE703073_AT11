
server {
    listen 80;
    server_name localhost;

    root /var/www/html/frontend/dist;
    index index.html;

    # File dữ liệu bản đồ
    location = /data/map-locations.json {
        alias /var/www/html/frontend/public/data/map-locations.json;
        default_type application/json;
        charset utf-8;
        add_header Cache-Control "no-store";
    }

    # Chuyển các API đến Laravel
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/backend/public;
        fastcgi_pass app:9000;
    }

    # Vue Router xử lý các trang giao diện
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Chặn truy cập file ẩn
    location ~ /\.ht {
        deny all;
    }
}
